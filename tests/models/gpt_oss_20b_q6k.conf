# Model: gpt-oss-20b-UD-Q6_K_XL
# Size: 12GB | Split across CUDA1 + CUDA2
# Location: ~/Applications/models/GPT_OSS_20B/gpt-oss-20b-UD-Q6_K_XL.gguf

model_path = ~/Applications/models/GPT_OSS_20B/gpt-oss-20b-UD-Q6_K_XL.gguf
devices = CUDA1,CUDA2
port = 8084
temp = 0.6
top_p = 0.95
top_k = 20
min_p = 0.00
ctx_size = 32000
cache_type_k = q4_0
cache_type_v = q4_0
n_gpu_layers = 99
parallel = 3
flash_attn = true
jinja = true
fit = false
reasoning = false

# Rubrics used (from rubrics/ directory):
#   numpy_i          → rubric_numpy_i.md
#   numpy_ii         → rubric_numpy_ii.md

# Command:
# llama-server -m $model_path -dev CUDA1,CUDA2 --port 8084 --host 0.0.0.0 \
#   --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.00 \
#   --ctx-size 32000 -fa on --cache-type-k q4_0 --cache-type-v q4_0 \
#   --n-gpu-layers 99 --fit off --reasoning off --parallel 3 --jinja
