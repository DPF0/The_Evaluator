# Model: gemma-4-12B-agentic-fable5-composer2.5-v2-3.5x-tau2 (fine-tuned)
# Source: https://huggingface.co/yuxinlu1/gemma-4-12B-agentic-fable5-composer2.5-v2-3.5x-tau2-GGUF
# Size: 6.9GB | Fits on single GPU
# Location: ~/Applications/models/Gemma_4_12B/gemma4-v2-Q4_K_M.gguf

model_path = ~/Applications/models/Gemma_4_12B/gemma4-v2-Q4_K_M.gguf
devices = CUDA1
port = 8084
temp = 0.6
top_p = 0.95
top_k = 64
min_p = 0.00
ctx_size = 32000
cache_type_k = q4_0
cache_type_v = q4_0
n_gpu_layers = 99
parallel = 3
flash_attn = true
jinja = false
fit = false
reasoning = false

# Rubrics used (from rubrics/ directory):
#   numpy_i          → rubric_numpy_i.md
#   numpy_ii         → rubric_numpy_ii.md

# Command:
# llama-server -m $model_path -dev CUDA1 --port 8084 --host 0.0.0.0 \
#   --temp 0.6 --top-p 0.95 --top-k 64 --min-p 0.00 \
#   --ctx-size 32000 -fa on --cache-type-k q4_0 --cache-type-v q4_0 \
#   --n-gpu-layers 99 --fit off --reasoning off --parallel 3
