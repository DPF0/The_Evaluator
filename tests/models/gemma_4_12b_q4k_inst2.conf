# Model: gemma-4-12B-it-qat-UD-Q4_K_XL (Instance 2)
# Size: 6.3GB | Single GPU
# Location: ~/Applications/models/Gemma_4_12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf

model_path = ~/Applications/models/Gemma_4_12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
devices = CUDA2
port = 8085
temp = 0.6
top_p = 0.95
top_k = 64
min_p = 0.00
ctx_size = 32000
cache_type_k = q4_0
cache_type_v = q4_0
n_gpu_layers = 99
parallel = 3
flash_attn = true
jinja = false
fit = false
reasoning = false

# IMPORTANT: This model runs as 2 instances (inst1:8084 + inst2:8085).
# Test runner uses ThreadPoolExecutor(2) for concurrent evaluation across both ports.
# ALL dual-instance models on 8084+8085 use this same concurrent pattern.

# Rubrics used (from rubrics/ directory):
#   numpy_i          → rubric_numpy_i.md
#   numpy_ii         → rubric_numpy_ii.md

# Command:
# llama-server -m $model_path -dev CUDA2 --port 8085 --host 0.0.0.0 \
#   --temp 0.6 --top-p 0.95 --top-k 64 --min-p 0.00 \
#   --ctx-size 32000 -fa on --cache-type-k q4_0 --cache-type-v q4_0 \
#   --n-gpu-layers 99 --fit off --reasoning off --parallel 3
